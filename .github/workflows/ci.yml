name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  proof:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy pytest -r api/requirements.txt
      - name: Test results for the proof table
        run: |
          mkdir -p proof
          (cd api && DEMO_MODE=1 python -m pytest -q --junitxml=../proof/pytest.xml)
          (cd web && npm install --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test --reporter=json > ../proof/playwright.json)
      - name: Record the demo path and build the video (silent narration in CI)
        run: |
          (cd web && DEMO_MODE=1 npx next start -p 3100 &) && sleep 2
          for i in $(seq 30); do curl -sf http://127.0.0.1:3100/ >/dev/null && break; sleep 1; done
          python tools/proof/narrate.py prepare --silent tools/proof/demo-path.json
          (cd web && PROOF_DIR=../proof node ../tools/proof/record.mjs ../tools/proof/demo-path.json)
          python tools/proof/narrate.py build
          sh tools/proof/mux.sh proof
          python tools/proof/check_video.py
          python tools/proof/proof_table.py tools/proof/claims.json | tee proof/proven.md
          python -m pytest -q tools/proof/test_proof.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof
          path: |
            proof/demo.mp4
            proof/demo.gif
            proof/shots/
            proof/proven.md
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the action lists a pull request's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
