name: Bug report
description: Something in the starter is broken
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Part
      options: ["web (Next.js)", "api (FastAPI)", "CI", "docs"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, the DEMO_MODE and RECORD settings, and the first error line.
    validations:
      required: true
